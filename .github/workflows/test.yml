name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run h3re tests
        run: python3 -m unittest discover -s tools/h3re/tests

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Banned-API lint (simulation modules)
        run: python3 tools/lint/banned_api_lint.py

      - name: Determinism soak (default policies)
        working-directory: tools/h3re
        run: python3 -m h3re.soak --games 30 --max-steps 120 -q

      - name: Soak policy matrix under two PYTHONHASHSEED values
        # The trace digest (SHA-256 over per-step state hashes and events) must
        # be identical; the second run exits 1 on a digest mismatch.
        working-directory: tools/h3re
        run: |
          PYTHONHASHSEED=0 python3 -m h3re.soak --games 10 --max-steps 120 \
            --policy-matrix -q --digest-out "$RUNNER_TEMP/digest-a.txt"
          PYTHONHASHSEED=12345 python3 -m h3re.soak --games 10 --max-steps 120 \
            --policy-matrix -q --expect-digest-file "$RUNNER_TEMP/digest-a.txt"

  real-files:
    # Optional: runs only when dispatched manually, on a self-hosted runner
    # that has the game data. The runner variable H3_DATA_DIR gives its path.
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    env:
      H3_DATA_DIR: ${{ vars.H3_DATA_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Run h3re tests against real game files
        run: python3 -m unittest discover -s tools/h3re/tests -v

  kotlin-sim:
    # Kotlin engine (android/sim) tests, plus a check that the committed
    # conformance vectors still match a fresh Python generation (ADR-0007).
    # The Gradle wrapper is pinned in android/gradle/wrapper.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Kotlin sim tests
        working-directory: android
        run: ./gradlew --no-daemon :sim:test

      - name: Conformance vectors are up to date
        # Fails if a Python change moved the vectors without regenerating them.
        working-directory: tools/h3re
        run: python3 -m h3re.vectors --check

      - name: Upload Gradle test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-sim-test-report
          path: |
            android/sim/build/reports/tests/
            android/sim/build/test-results/
          if-no-files-found: warn

  android-app:
    # The :app module has never been built. Keep this job non-blocking until it
    # is green, then remove continue-on-error so it gates the workflow.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Locate the runner's Android SDK
        run: |
          # The ubuntu-latest image sets ANDROID_HOME; fall back to its usual path.
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            # yes exits on SIGPIPE once sdkmanager closes stdin; that is expected.
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "sdkmanager not found; relying on Gradle to install SDK components."
          fi

      - name: Assemble debug app
        working-directory: android
        run: ./gradlew --no-daemon -PwithApp=true :app:assembleDebug
